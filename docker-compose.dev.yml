version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: srp-ai-os-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: srpaios
      POSTGRES_PASSWORD: srpaios_dev
      POSTGRES_DB: srpaios
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U srpaios']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srp-ai-os-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
