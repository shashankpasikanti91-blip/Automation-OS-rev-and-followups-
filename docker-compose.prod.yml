version: '3.9'

# Production compose for Hetzner server — uses unique ports/names to avoid conflicts
services:
  srp-postgres:
    image: postgres:16-alpine
    container_name: srp-ai-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srpaios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srpaios_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-srpaios}
    ports:
      - '5442:5432'
    volumes:
      - srp_postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-srpaios}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srp-network

  srp-redis:
    image: redis:7-alpine
    container_name: srp-ai-os-redis
    restart: unless-stopped
    ports:
      - '6389:6379'
    volumes:
      - srp_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srp-network

  srp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srp-ai-os-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-srpaios}:${POSTGRES_PASSWORD:-srpaios_secret_2026}@srp-postgres:5432/${POSTGRES_DB:-srpaios}
      REDIS_URL: redis://srp-redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3100}
      NODE_ENV: production
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '3100:3000'
    depends_on:
      srp-postgres:
        condition: service_healthy
      srp-redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm start"
    networks:
      - srp-network

networks:
  srp-network:
    driver: bridge

volumes:
  srp_postgres_data:
    driver: local
  srp_redis_data:
    driver: local
